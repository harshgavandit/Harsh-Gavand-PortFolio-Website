name: Verify portfolio
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: portfolio-verification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: node scripts/run-npm.mjs ci --include=dev --no-audit --no-fund
      - run: npm run lint
      - run: npm run type-check
      - run: npm test
      - run: npm run build
      - run: npm run test:prerender
      - run: node scripts/check-ai-release.mjs
      # Paid provider evaluations are an explicit local release step, never a PR-secret dependency.
