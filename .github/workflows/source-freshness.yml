name: Check indexed source freshness
on:
  workflow_dispatch:
  schedule:
    - cron: '30 5 * * 1'
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - run: node scripts/check-source-freshness.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
